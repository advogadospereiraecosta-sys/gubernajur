services:
  # PostgreSQL Database
  #
  # NOTA: não publicamos a porta. O override de produção também não a traz de
  # volta, e `ports: []` num override NÃO limpa a lista — é a mesma armadilha
  # que os volumes deram. Se abrimos a porta aqui, ela fica exposta em prod.
  # Para acesso directo em desenvolvimento, use infra/docker-compose.dev.yml.
  db:
    image: postgres:15-alpine
    container_name: gubernajur-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: gubernajur
      POSTGRES_PASSWORD: ${DB_PASSWORD:-gubernajur_secret_password}
      POSTGRES_DB: gubernajur
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gubernajur"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: gubernajur-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Backend (NestJS)
  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    container_name: gubernajur-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://gubernajur:${DB_PASSWORD:-gubernajur_secret_password}@db:5432/gubernajur
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key}
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Web Frontend (Next.js)
  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
    container_name: gubernajur-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://api:3001
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    depends_on:
      - api

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: gubernajur-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx:/etc/nginx/conf.d
      - ./infra/nginx/ssl:/etc/nginx/ssl
    depends_on:
      - web
      - api

volumes:
  postgres_data:
  redis_data:
